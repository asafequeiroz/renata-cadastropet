<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CADASTRO</h1>

    <div class="caixa">

        <p>Nome do tutor</p>
        <input id="nome_tutor" type="text" placeholder="Digite o nome do tutor">

        <p>Nome do pet</p>
        <input id="nome_pet" type="text" placeholder="Digite o nome do pet">

        <p>Raça do pet</p>
        <input id="raca" type="text" placeholder="Digite a raça do pet">

        <p>Gênero do pet</p>
        <select id="genero">
            <option value="">Selecione</option>
            <option value="Macho">Macho</option>
            <option value="Fêmea">Fêmea</option>
        </select>

        <div class="botão">
            <button id="botao">Acessar</button>
        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
